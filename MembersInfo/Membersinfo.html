            <div class="MembersInfo__PhotoNav">

                    <img id="staffPhoto" src="" alt="Staff photo">

            <div class="MembersInfo__Map">
                <iframe
                    id="staffMap"
                    src=""
                    width="100%"
                    height="100%"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy">

            <div class="MembersInfo__Details">
                <p id="staffName"></p>
                <p id="staffPosition"></p>
                <p id="staffPlace"></p>
